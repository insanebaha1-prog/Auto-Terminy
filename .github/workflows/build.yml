name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Build Release APK
        run: |
          rm -rf android
          flutter create --project-name auto_termin --org com.autotermin.app --platforms=android .

          python3 -c 'import pathlib; p = pathlib.Path("pubspec.yaml"); t = p.read_text(); p.write_text(t.replace("dependencies:\n  flutter:\n    sdk: flutter", "dependencies:\n  flutter:\n    sdk: flutter\n  flutter_localizations:\n    sdk: flutter") if "flutter_localizations:" not in t else t)'

          python3 -c 'import pathlib; p = pathlib.Path("android/app/src/main/AndroidManifest.xml"); m = p.read_text(); m = m.replace("android:label=\"auto_termin\"", "android:label=\"AutoTermin\""); perms = "<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>\n    <uses-permission android:name=\"android.permission.VIBRATE\"/>\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\"/>\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>\n    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.USE_EXACT_ALARM\"/>\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n    <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\"/>\n    <application"; m = m.replace("<application", perms, 1) if "POST_NOTIFICATIONS" not in m else m; rec = "<receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver\" />\n        <receiver android:exported=\"false\" android:name=\"com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.BOOT_COMPLETED\"/>\n                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\"/>\n                <action android:name=\"android.intent.action.QUICKBOOT_POWERON\" />\n                <action android:name=\"com.htc.intent.action.QUICKBOOT_POWERON\"/>\n            </intent-filter>\n        </receiver>\n    </application>"; m = m.replace("</application>", rec, 1) if "ScheduledNotificationReceiver" not in m else m; p.write_text(m)'

          flutter pub get
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-terminy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
