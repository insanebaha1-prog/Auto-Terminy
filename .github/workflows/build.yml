name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Android Project Structure & Build
        run: |
          # Zachowujemy lib i pubspec, a resztę struktury Androida generujemy na nowo w najnowszym standardzie
          flutter create --project-name auto_termin --org com.autotermin.app --platforms=android .
          
          # Podmiana wersji Kotlina w android/settings.gradle na poprawną 1.9.24
          python3 -c '
          import os
          path = "android/settings.gradle"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              if "org.jetbrains.kotlin.android" in content:
                  import re
                  content = re.sub(r"version \"[^\"]+\"", "version \"1.9.24\"", content)
              with open(path, "w") as f:
                  f.write(content)
          '

          # Włączenie MultiDex w app/build.gradle
          python3 -c '
          import os
          path = "android/app/build.gradle"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              if "multiDexEnabled" not in content:
                  content = content.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true")
              with open(path, "w") as f:
                  f.write(content)
          '

          flutter pub get
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-terminy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
