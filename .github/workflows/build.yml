name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Clean Build Setup
        run: |
          # Usunięcie starych plików konfiguracji androida i wygenerowanie ich na nowo w standardzie Flutter 3.24
          rm -rf android
          flutter create --project-name auto_termin --org com.autotermin.app --platforms=android .

          # Automatyczna korekta wersji wtyczki Kotlin na 1.9.24 w android/settings.gradle
          python3 -c '
          path = "android/settings.gradle"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace("version \"1.9.", "version \"1.9.24")
          if "org.jetbrains.kotlin.android" in content and "1.9.24" not in content:
              import re
              content = re.sub(r"version \"[^\"]+\"", "version \"1.9.24\"", content)
          with open(path, "w") as f:
              f.write(content)
          '

          flutter pub get
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-terminy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
