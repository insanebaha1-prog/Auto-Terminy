name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Android Scaffolding
        run: |
          flutter create --project-name auto_termin --org com.autotermin.app --platforms=android .
          git checkout pubspec.yaml

          python3 << 'EOF'
          import os, re

          # Kotlin version
          settings_path = "android/settings.gradle"
          if os.path.exists(settings_path):
              with open(settings_path, "r") as f:
                  c = f.read()
              c = re.sub(r'id "org\.jetbrains\.kotlin\.android" version "[^"]+"', 'id "org.jetbrains.kotlin.android" version "1.9.24"', c)
              with open(settings_path, "w") as f:
                  f.write(c)

          # Desugaring & MultiDex
          bg_path = "android/app/build.gradle"
          if os.path.exists(bg_path):
              with open(bg_path, "r") as f:
                  bg = f.read()
              if "coreLibraryDesugaring" not in bg:
                  bg = bg.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                  bg = bg.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true")
                  if "dependencies {" in bg:
                      bg = bg.replace("dependencies {", "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'")
                  else:
                      bg += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'\n}\n"
              with open(bg_path, "w") as f:
                  f.write(bg)

          # Permissions for gallery and notifications
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m = f.read()
              m = m.replace('android:label="auto_termin"', 'android:label="AutoTermin"')
              m = m.replace('android:label="@string/app_name"', 'android:label="AutoTermin"')
              
              perms = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              """
              if "POST_NOTIFICATIONS" not in m:
                  m = m.replace("<application", perms + "\n    <application")
              with open(manifest_path, "w") as f:
                  f.write(m)

          strings_path = "android/app/src/main/res/values/strings.xml"
          os.makedirs(os.path.dirname(strings_path), exist_ok=True)
          with open(strings_path, "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">AutoTermin</string>\n</resources>')

          print("Konfiguracja zakonczona sukcesem!")
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-terminy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
