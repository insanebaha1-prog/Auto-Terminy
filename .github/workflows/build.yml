name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build APK with Fixed Kotlin Version
        run: |
          # Usunięcie starego folderu android i wygenerowanie świeżego projektu
          rm -rf android
          flutter create --project-name auto_termin --org com.autotermin.app --platforms=android .

          # Dokładna, bezpieczna podmiana wersji wtyczki Kotlin w pliku settings.gradle
          python3 -c '
          path = "android/settings.gradle"
          with open(path, "r") as f:
              lines = f.readlines()
          
          new_lines = []
          for line in lines:
              if "org.jetbrains.kotlin.android" in line:
                  # Podmieniamy całą linię na poprawną deklarację wtyczki z wersją 1.9.23
                  new_lines.append("    id \"org.jetbrains.kotlin.android\" version \"1.9.23\" apply false\n")
              else:
                  new_lines.append(line)
                  
          with open(path, "w") as f:
              f.writelines(new_lines)
          '

          flutter pub get
          flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-terminy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
